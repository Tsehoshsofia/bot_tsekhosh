<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>София - Основы программирования</title>
    <style>
        /* Классическая деловая палитра */
        :root {
            --bg-page: #f4f6f8; /* Строгий светло-серый с теплым оттенком */
            --chat-bg: #ffffff;
            --text-main: #1e293b; /* Темно-серый, почти черный */
            --text-muted: #64748b;
            --accent-blue: #2563eb; /* Деловой синий */
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: linear-gradient(180deg, #fdfbfb 0%, #ebedee 100%);
        }

        /* Контейнер чата - строгая карточка */
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 680px;
            background: var(--chat-bg);
            border-radius: 8px; /* Строгие углы */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Шапка */
        #chat-header {
            background: #ffffff;
            color: var(--text-main);
            padding: 18px 20px;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Индикатор статуса онлайн */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* Область сообщений */
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* Сообщения */
        .message {
            max-width: 85%;
            padding: 14px 16px;
            border-radius: 6px; /* Строгие углы */
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Сообщение бота */
        .msg-bot {
            background: #ffffff;
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        /* Сообщение пользователя */
        .msg-user {
            background: var(--accent-blue);
            color: #ffffff;
            align-self: flex-end;
        }

        /* Блок кнопок */
        #buttons-container {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        /* Стили кнопок */
        .chat-btn {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .chat-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Главная (синяя) кнопка */
        .chat-btn.primary {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            text-align: center;
            font-weight: 600;
        }

        .chat-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* Ссылки */
        a {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Стилизация кода в тексте */
        code {
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #b91c1c;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span class="status-dot"></span> София | Преподаватель Python
    </div>
    <div id="chat-box"></div>
    <div id="buttons-container"></div>
</div>

<script>
    // --- БАЗА ССЫЛОК ---
    const BASE_URL = "https://github.com/Tsehoshsofia/bot_tsekhosh/blob/main/";
    
    const PRESENTATIONS = {
        "1": { title: "Введение и типы переменных", url: BASE_URL + "Типы_переменных.pdf" },
        "2": { title: "Работа с числовыми данными", url: "#" },
        "3": { title: "Работа с текстовыми данными", url: BASE_URL + "Основные_методы_работы.pdf" },
        "4": { title: "Условный оператор", url: BASE_URL + "Условные_операторы.pdf" },
        "5": { title: "Циклы", url: "#" },
        "6": { title: "Множества", url: BASE_URL + "Множества.pdf" },
        "7": { title: "Строки и символы", url: "#" },
        "8": { title: "Списки", url: BASE_URL + "Списки.pdf" },
        "9": { title: "Библиотеки и функции", url: BASE_URL + "Библиотеки_Python.pdf" },
        "10": { title: "Работа с файлами", url: BASE_URL + "Работа_с_файлами.pdf" }
    };

    const QUEST_LINK = "https://project12909115.tilda.ws/page155362456.html";

    const QUIZ = [
        { q: "Что выведет код: <code>print([10, 20, 30, 40][1:3])</code>?", opts: ["[10, 20]", "[20, 30]", "[20, 30, 40]"], correct: 1, exp: "Срез [1:3] берет элементы с индексом 1 до 2, не включая 3." },
        { q: "Какой тип данных у результата: <code>input('Введите число')</code>?", opts: ["int", "str", "float"], correct: 1, exp: "Функция input() всегда возвращает строку (str), даже если введено число." },
        { q: "Какой метод удалит пробелы в начале и в конце строки?", opts: ["split()", "strip()", "replace()"], correct: 1, exp: "Метод strip() обрезает пробельные символы с обоих концов." }
    ];

    let state = 'registration_age';
    let userData = { age: null, gender: null, status: null, score: 0 };
    let quizIdx = 0;

    const chatBox = document.getElementById('chat-box');
    const btnContainer = document.getElementById('buttons-container');

    function addMessage(text, sender = 'bot') {
        const div = document.createElement('div');
        div.className = `message msg-${sender}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
    }

    function renderButtons(buttons) {
        btnContainer.innerHTML = '';
        buttons.forEach(btn => {
            const b = document.createElement('button');
            b.className = btn.primary ? 'chat-btn primary' : 'chat-btn';
            b.innerText = btn.text;
            b.onclick = () => handleInput(btn.value, btn.text);
            btnContainer.appendChild(b);
        });
    }

    function showMainMenu() {
        state = 'menu';
        addMessage("Выберите необходимый раздел для продолжения работы:");
        renderButtons([
            { text: "📚 Методические материалы", value: "presentations" },
            { text: "📝 Пройти тестирование", value: "start_quiz", primary: true },
            { text: "🎮 Перейти к квесту", value: "start_quest" },
            { text: "📊 Моя статистика", value: "analytics" }
        ]);
    }

    function handleInput(value, text) {
        addMessage(text, 'user');
        btnContainer.innerHTML = ''; 

        setTimeout(() => {
            if (state === 'registration_age') {
                userData.age = text;
                state = 'registration_gender';
                addMessage(`Принято. Укажите ваш пол для корректного обращения:`);
                renderButtons([{text: "Мужской", value: "М"}, {text: "Женский", value: "Ж"}]);
            } 
            else if (state === 'registration_gender') {
                userData.gender = value;
                state = 'registration_status';
                addMessage("Выберите ваш текущий статус в системе образования:");
                renderButtons([{text: "Студент 1 курса", value: "Студент"}, {text: "Преподаватель", value: "Преподаватель"}]);
            }
            else if (state === 'registration_status') {
                userData.status = value;
                addMessage(value === 'Преподаватель' ? "Здравствуйте! Готова помочь вам с проверкой знаний студентов." : "Отлично! Начнем изучение Python. Выберите действие:");
                showMainMenu();
            }
            else if (value === 'menu') {
                addMessage("Возврат в главное меню.");
                showMainMenu();
            }
            else if (value === 'presentations') {
                state = 'presentations_menu';
                addMessage("Доступные темы для изучения:");
                let btns = Object.keys(PRESENTATIONS).map(k => ({text: `${k}. ${PRESENTATIONS[k].title}`, value: `pres_${k}`}));
                btns.push({text: "⬅️ Вернуться в меню", value: "menu", primary: true});
                renderButtons(btns);
            }
            else if (value.startsWith('pres_')) {
                const id = value.split('_')[1];
                let linkHtml = PRESENTATIONS[id].url === "#" 
                    ? "<i>(Материал находится в разработке)</i>" 
                    : `<br><br><a href="${PRESENTATIONS[id].url}" target="_blank">📄 Скачать презентацию (PDF)</a>`;
                
                addMessage(`Тема: <b>${PRESENTATIONS[id].title}</b>.${linkHtml}`);
                renderButtons([{text: "⬅️ Назад к темам", value: "presentations"}]);
            }
            else if (value === 'start_quiz') {
                state = 'quiz';
                quizIdx = 0;
                userData.score = 0;
                askQuiz();
            }
            else if (state === 'quiz') {
                const isCorrect = parseInt(value) === QUIZ[quizIdx].correct;
                if (isCorrect) userData.score++;
                
                addMessage(isCorrect ? `✅ Верно. ${QUIZ[quizIdx].exp}` : `❌ Ошибка. ${QUIZ[quizIdx].exp}`);
                quizIdx++;
                
                if (quizIdx >= QUIZ.length) {
                    addMessage(`Тестирование завершено. Ваш результат: <b>${userData.score} из ${QUIZ.length}</b>.`);
                    showMainMenu();
                } else {
                    setTimeout(askQuiz, 1000); 
                }
            }
            else if (value === 'start_quest') {
                addMessage("⚠️ <b>Внимание:</b> В квесте нельзя ошибаться. Одна ошибка — и вы начинаете заново!");
                addMessage(`Для прохождения интерактивного кейса перейдите по ссылке:<br><br><a href="${QUEST_LINK}" target="_blank" style="font-size:15px;">🎮 Открыть квест</a>`);
                renderButtons([{text: "⬅️ В меню", value: "menu", primary: true}]);
            }
            else if (value === 'analytics') {
                addMessage(`📊 <b>Статистика:</b><br>Правильных ответов: ${userData.score}<br>Статус: ${userData.status}`);
                const percent = (userData.score / QUIZ.length) * 100;
                addMessage(`<div style="background:#e2e8f0; border-radius:4px; width:100%; height:8px; margin-top:5px;"><div style="background:var(--accent-blue); width:${percent}%; height:100%; border-radius:4px; transition: width 1s;"></div></div>`);
                renderButtons([{text: "⬅️ В меню", value: "menu", primary: true}]);
            }
        }, 500); 
    }

    function askQuiz() {
        addMessage(`<b>Вопрос ${quizIdx + 1} из ${QUIZ.length}:</b><br><br>${QUIZ[quizIdx].q}`);
        renderButtons(QUIZ[quizIdx].opts.map((opt, i) => ({text: opt, value: i})));
    }

    // --- СТАРТ ---
    window.onload = () => {
        addMessage("Здравствуйте. Меня зовут София, я преподаватель дисциплины <b>«Основы программирования»</b>. Я помогу тебе разобраться с типами данных в Python.<br><br>Для начала авторизации, укажите ваш возраст:");
        renderButtons([{text: "17", value: "17"}, {text: "18", value: "18"}, {text: "19", value: "19"}]);
    };
</script>
</body>
</html>
